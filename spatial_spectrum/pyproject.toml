[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "spatial-spectrum"
version = "1.0.0"
description = "A comprehensive Python library for spatial spectrum estimation and array signal processing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Spatial Spectrum Library Contributors"}
]
keywords = [
    "array-signal-processing",
    "doa-estimation",
    "music-algorithm",
    "esprit",
    "beamforming",
    "spatial-spectrum",
    "source-localization",
    "radar",
    "sonar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "sphinx>=5.0",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/username/spatial-spectrum"
Documentation = "https://spatial-spectrum.readthedocs.io"
Repository = "https://github.com/username/spatial-spectrum"
Issues = "https://github.com/username/spatial-spectrum/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["spatial_spectrum*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
